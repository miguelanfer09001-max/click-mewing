<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAD CLICKER 2077</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-color: #c5c6c7;
            --neon-blue: #66fcf1;
            --neon-green: #45a29e;
            --accent: #ff007f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            user-select: none;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        /* BOTÓN DE MÚSICA */
        .music-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1000;
            transition: 0.2s;
        }

        .music-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* COLUMNA IZQUIERDA: EL CLICKER */
        .clicker-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 2px solid var(--neon-green);
            position: relative;
        }

        h1 {
            color: var(--neon-blue);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 5px;
            text-align: center;
            transition: text-shadow 0.3s;
        }

        .points-display {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        .stats-text {
            color: var(--neon-green);
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .img-container {
            position: relative;
            width: 320px;
            height: 320px;
            border: 5px solid var(--neon-blue);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.4);
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.2s;
            z-index: 10;
        }

        .img-container:active {
            transform: scale(0.90);
            box-shadow: 0 0 50px var(--accent);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ANIMACIONES DE PARTÍCULAS */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: explode 0.8s ease-out forwards;
            z-index: 20;
        }

        @keyframes explode {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); }
            100% { opacity: 0; transform: translate(var(--tx), calc(var(--ty) - 50px)) scale(1) rotate(var(--rot)); }
        }

        /* EFECTO DE DESTELLO EN COMPRAS */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        @keyframes flashAnim {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* BOTÓN DE EVOLUCIÓN */
        .btn-evolve {
            background: linear-gradient(45deg, var(--accent), #ff5e00);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 40px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent);
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-evolve:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ff5e00;
        }

        .btn-evolve:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* COLUMNA DERECHA: LA TIENDA */
        .shop-section {
            width: 420px;
            background-color: var(--panel-bg);
            padding: 20px;
            overflow-y: auto;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .shop-title {
            color: var(--accent);
            font-size: 2rem;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 15px;
            margin-top: 0;
            text-shadow: 0 0 10px var(--accent);
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--neon-green);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
        }

        .shop-item:hover:not(.disabled) {
            background: rgba(102, 252, 241, 0.15);
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
            transform: translateX(-5px);
        }

        .shop-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
        }

        .shop-item.purchased {
            animation: purchaseBump 0.3s ease;
            background-color: rgba(57, 255, 20, 0.3) !important;
            border-color: #39ff14 !important;
        }

        @keyframes purchaseBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px #39ff14; }
            100% { transform: scale(1); }
        }

        .item-info h3 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.3rem;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .item-info p {
            margin: 0;
            color: var(--neon-blue);
            font-size: 1rem;
            font-weight: bold;
        }

        .item-cost {
            font-weight: bold;
            color: var(--accent);
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .item-count {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 900;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .shop-section { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA (OCULTO) -->
    <audio id="bg-music" loop>
        <source src="phonk.mp3" type="audio/mpeg">
    </audio>

    <!-- EFECTO DE FLASH GLOBAL -->
    <div class="flash" id="global-flash"></div>

    <!-- SECCIÓN DEL CLICKER -->
    <div class="clicker-section" id="click-area">
        
        <button id="music-toggle" class="music-btn" onclick="toggleMusic()">🎵 MÚSICA: OFF</button>

        <h1 id="rank-title">NIVEL 1: TOCAMORRAS BASE</h1>
        
        <div class="points-display">🤫 <span id="mewing-count">0</span> Pts</div>
        <div class="stats-text">
            💥 <span id="damage-val">1</span> x Clic | ⚡ <span id="passive-val">0</span> x Seg
        </div>

        <div class="img-container" id="main-img-container" onpointerdown="clickMewing(event)">
            <img id="chad-img" src="WhatsApp Image 2026-09-16 at 10.31.37 AM.jpeg" alt="Chad">
        </div>

        <button class="btn-evolve" id="btn-evolve" onclick="evolucionarFase()" disabled>
            EVOLUCIONAR (Cuesta 500 Pts)
        </button>
    </div>

    <!-- SECCIÓN DE LA TIENDA -->
    <div class="shop-section">
        <h2 class="shop-title">MEJORAS SIGMA</h2>
        <div id="shop-container">
            <!-- La tienda se carga con JS -->
        </div>
    </div>

    <script>
        let puntos = 0;
        let danoClic = 1;
        let pasivoSeg = 0;
        let faseActual = 0;
        
        // CONTROL DE MÚSICA
        let musicaIniciada = false;
        const reproductor = document.getElementById("bg-music");
        reproductor.volume = 0.5; // Volumen al 50% para que no sature

        function toggleMusic() {
            const btn = document.getElementById("music-toggle");
            if (reproductor.paused) {
                reproductor.play();
                btn.innerText = "🎵 MÚSICA: ON";
                musicaIniciada = true;
            } else {
                reproductor.pause();
                btn.innerText = "🎵 MÚSICA: OFF";
            }
        }

        const fases = [
            { id: 1, titulo: "NIVEL 1: TOCAMORRAS BASE", costo: 500, foto: "WhatsApp Image 2026-09-16 at 10.31.37 AM.jpeg", bg: "#0b0c10" },
            { id: 2, titulo: "NIVEL 2: SIGMA MEWING", costo: 2500, foto: "WhatsApp Image 2026-09-16 at 10.31.36 AM.jpeg", bg: "#1a0b1c" },
            { id: 3, titulo: "NIVEL 3: SUPER SAIYAYIN CHAD", costo: 15000, foto: "WhatsApp Image 2026-09-16 at 10.31.35 AM.jpeg", bg: "#1c1700" },
            { id: 4, titulo: "NIVEL 4: CHAD SUPREMO CYBERPUNK", costo: 50000, foto: "WhatsApp Image 2026-09-16 at 10.31.34 AM.jpeg", bg: "#001b1c" },
            { id: 5, titulo: "NIVEL 5: SKIBIDI TOILET RIZZ", costo: 250000, foto: "WhatsApp Image 2026-09-16 at 10.31.34 AM (1).jpeg", bg: "#1c0000" },
            { id: 6, titulo: "NIVEL 6: EL 67 BOY", costo: 1000000, foto: "WhatsApp Image 2026-09-16 at 10.31.33 AM.jpeg", bg: "#05001c" },
            { id: 7, titulo: "NIVEL MÁX: DIOS SUPREMO VIRGEN", costo: 0, foto: "WhatsApp Image 2026-09-16 at 10.31.32 AM.jpeg", bg: "#ffffff" }
        ];

        const mejoras = [
            { id: 0, nombre: "Dedos de Acero", desc: "+1 Clic", tipo: "clic", valor: 1, costoBase: 15, costoActual: 15, comprados: 0 },
            { id: 1, nombre: "Chicle Neón", desc: "+2 Auto/seg", tipo: "auto", valor: 2, costoBase: 50, costoActual: 50, comprados: 0 },
            { id: 2, nombre: "Pistola de Rizz", desc: "+10 Clic", tipo: "clic", valor: 10, costoBase: 200, costoActual: 200, comprados: 0 },
            { id: 3, nombre: "Mandíbula de Titanio", desc: "+25 Auto/seg", tipo: "auto", valor: 25, costoBase: 1000, costoActual: 1000, comprados: 0 },
            { id: 4, nombre: "Aura Sigma", desc: "+100 Clic", tipo: "clic", valor: 100, costoBase: 4000, costoActual: 4000, comprados: 0 },
            { id: 5, nombre: "Armadura Skibidi", desc: "+500 Auto/seg", tipo: "auto", valor: 500, costoBase: 25000, costoActual: 25000, comprados: 0 },
            { id: 6, nombre: "Gafas del 67", desc: "+2500 Clic", tipo: "clic", valor: 2500, costoBase: 150000, costoActual: 150000, comprados: 0 }
        ];

        const particleColors = ['#ff007f', '#00f3ff', '#ffe600', '#39ff14', '#ffffff'];

        function clickMewing(e) {
            // Arrancar música al primer clic
            if (!musicaIniciada) {
                reproductor.play().catch(()=>console.log("Esperando interacción para audio"));
                document.getElementById("music-toggle").innerText = "🎵 MÚSICA: ON";
                musicaIniciada = true;
            }

            puntos += danoClic;
            crearParticula(e);
            animarPuntaje();
            actualizarUI();
        }

        function animarPuntaje() {
            const puntaje = document.querySelector('.points-display');
            puntaje.style.transform = 'scale(1.1)';
            setTimeout(() => puntaje.style.transform = 'scale(1)', 50);
        }

        function crearParticula(e) {
            const container = document.getElementById('main-img-container');
            const rect = container.getBoundingClientRect();
            
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = `+${danoClic}`;
            
            const color = particleColors[Math.floor(Math.random() * particleColors.length)];
            text.style.color = color;
            text.style.textShadow = `0 0 10px ${color}, 0 0 20px #000`;

            let startX = e.clientX - rect.left;
            let startY = e.clientY - rect.top;

            const tx = (Math.random() * 150 - 75) + 'px';
            const ty = (Math.random() * -100 - 50) + 'px';
            const rot = (Math.random() * 60 - 30) + 'deg';

            text.style.left = `${startX}px`;
            text.style.top = `${startY}px`;
            
            text.style.setProperty('--tx', tx);
            text.style.setProperty('--ty', ty);
            text.style.setProperty('--rot', rot);

            container.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function comprarMejora(index, divElement) {
            const item = mejoras[index];
            if (puntos >= item.costoActual) {
                puntos -= item.costoActual;
                item.comprados++;
                
                item.costoActual = Math.ceil(item.costoActual * 1.15);

                if (item.tipo === "clic") danoClic += item.valor;
                if (item.tipo === "auto") pasivoSeg += item.valor;

                divElement.classList.add('purchased');
                setTimeout(() => divElement.classList.remove('purchased'), 300);

                renderizarTienda();
                actualizarUI();
            }
        }

        function evolucionarFase() {
            const fase = fases[faseActual];
            if (puntos >= fase.costo && faseActual < fases.length - 1) {
                puntos -= fase.costo;
                faseActual++;
                
                const nuevaFase = fases[faseActual];
                document.getElementById("rank-title").innerText = nuevaFase.titulo;
                document.getElementById("chad-img").src = nuevaFase.foto;
                document.body.style.backgroundColor = nuevaFase.bg;

                const flash = document.getElementById("global-flash");
                flash.style.animation = 'none';
                flash.offsetHeight;
                flash.style.animation = 'flashAnim 1s ease-out';

                actualizarUI();
            }
        }

        setInterval(() => {
            if (pasivoSeg > 0) {
                puntos += pasivoSeg;
                actualizarUI();
            }
        }, 1000);

        function renderizarTienda() {
            const container = document.getElementById("shop-container");
            container.innerHTML = "";

            mejoras.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = `shop-item ${puntos < item.costoActual ? 'disabled' : ''}`;
                
                div.onclick = () => {
                    if (puntos >= item.costoActual) comprarMejora(index, div);
                };

                div.innerHTML = `
                    <div class="item-info">
                        <h3>${item.nombre}</h3>
                        <p>${item.desc}</p>
                        <div class="item-cost">Cuesta: ${item.costoActual} Pts</div>
                    </div>
                    <div class="item-count">${item.comprados}</div>
                `;
                container.appendChild(div);
            });
        }

        function actualizarUI() {
            document.getElementById("mewing-count").innerText = Math.floor(puntos);
            document.getElementById("damage-val").innerText = danoClic;
            document.getElementById("passive-val").innerText = pasivoSeg;

            const btnEvolve = document.getElementById("btn-evolve");
            if (faseActual >= fases.length - 1) {
                btnEvolve.innerText = "¡NIVEL DIOS ALCANZADO!";
                btnEvolve.disabled = true;
            } else {
                const proxFase = fases[faseActual];
                btnEvolve.innerText = `EVOLUCIONAR (Cuesta ${proxFase.costo} Pts)`;
                btnEvolve.disabled = puntos < proxFase.costo;
            }

            renderizarTienda();
        }

        renderizarTienda();
        actualizarUI();
    </script>
</body>
</html>
